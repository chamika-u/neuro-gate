[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-gate-diagram-export"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools]
packages = ["diagram_export"]

[tool.pytest.ini_options]
markers = ["render: requires the real Mermaid renderer"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.coverage.run]
branch = true
source = ["diagram_export"]
